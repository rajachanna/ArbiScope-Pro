[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiscope-pro"
version = "0.1.0"
description = "Read-only CEX order-book spread research and DEX liquidity intelligence"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Raja Channa / NextGen Tech Solutions"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
live = ["ccxt>=4.4,<5"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["arbiscope"]

[tool.setuptools.package-data]
arbiscope = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
